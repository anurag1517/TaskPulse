<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#14192b"/>
      <stop offset="100%" stop-color="#080b12"/>
    </radialGradient>
    
    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="45%" stop-color="#ff9500"/>
      <stop offset="55%" stop-color="#e040fb"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="#262d45" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Flame Shape -->
  <path d="M256 100 C270 160 330 200 330 275 C330 335 290 380 256 380 C222 380 182 335 182 275 C182 220 226 185 240 145 C244 190 260 215 272 235 C282 195 270 145 256 100 Z" 
        fill="url(#flameGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Core Flame Inner Highlight -->
  <path d="M256 190 C265 225 295 250 295 295 C295 330 275 355 256 355 C237 355 217 330 217 295 C217 265 238 245 248 220 C250 242 260 255 266 268 C271 245 264 218 256 190 Z" 
        fill="#fffae0" opacity="0.85"/>

  <!-- Pulse / ECG Heartbeat Wave -->
  <path d="M 64 300 L 170 300 L 195 245 L 225 355 L 256 175 L 287 385 L 317 260 L 342 300 L 448 300" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Center Pulse Dot -->
  <circle cx="256" cy="175" r="7" fill="#ffffff" filter="url(#glow)"/>
</svg>